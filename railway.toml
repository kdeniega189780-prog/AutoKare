# Railway deployment config for Laravel 13
# https://docs.railway.com/guides/laravel

[build]
builder = "RAILPACK"
buildCommand = "sh -c \"rm -rf node_modules && npm ci --cache /tmp/npm-cache --no-audit --no-fund && npm run build\""

[deploy]
startCommand = "chmod +x ./railway/start.sh && sh ./railway/start.sh"
preDeployCommand = "chmod +x ./railway/init-app.sh && sh ./railway/init-app.sh"
healthcheckPath = "/up"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
