# Railway deployment config for Laravel 13
# https://docs.railway.com/guides/laravel

[build]
builder = "RAILPACK"
# Railpack already installs node_modules; only build assets (caches in /tmp via .npmrc + vite.config.js).
buildCommand = "npm run build"

[deploy]
startCommand = "chmod +x ./railway/start.sh && sh ./railway/start.sh"
preDeployCommand = "chmod +x ./railway/init-app.sh && sh ./railway/init-app.sh"
healthcheckPath = "/up"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
